<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>CoreBank - Sign On</title>
<style type="text/css">
  body { font-family: Tahoma, Verdana, Arial, sans-serif; font-size: 11px; background: #ece9d8; }
  td { font-size: 11px; }
</style>
</head>
<body>
<br><br>
<center>
<table border="0" cellpadding="0" cellspacing="0" width="340" style="border: 2px outset #fff">
  <tr><td bgcolor="{{ theme.banner_color }}" style="color:#fff;padding:4px"><b>{{ theme.institution_name }}</b><br>CoreBank Teller Workstation</td></tr>
  <tr><td style="padding:10px">
    {% if message %}<font color="red">{{ message }}</font><br><br>{% endif %}
    <form method="post" action="/cb/login.asp" target="_top">
      <table border="0" cellpadding="3" cellspacing="0">
        <tr><td align="right">User ID:</td><td><input type="text" name="{{ p }}$txtUsr" size="18"></td></tr>
        <tr><td align="right">Password:</td><td><input type="password" name="{{ p }}$txtPwd" size="18"></td></tr>
        <tr><td></td><td><input type="submit" value="Sign On"></td></tr>
      </table>
    </form>
  </td></tr>
</table>
<br><font color="#666">Meridian CoreBank v{{ theme.product_version }} &mdash; Authorized use only.</font>
</center>
</body>
</html>
