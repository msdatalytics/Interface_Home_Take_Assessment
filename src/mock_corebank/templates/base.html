<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>CoreBank</title>
<style type="text/css">
  body { font-family: Tahoma, Verdana, Arial, sans-serif; font-size: 11px; background: #ece9d8; margin: 6px; }
  td { font-size: 11px; }
  .lbl { color: #333; text-align: right; padding-right: 6px; white-space: nowrap; }
  .hdr td { background: #d4d0c8; font-weight: bold; border-bottom: 1px solid #808080; }
  .grid td { border: 1px solid #a0a0a0; padding: 2px 6px; }
  .btn { font-size: 11px; padding: 1px 8px; }
  .ttl { background: {{ theme.banner_color }}; color: #fff; padding: 3px 6px; }
</style>
<script type="text/javascript">
  function __doPostBack(target) {
    var f = document.forms["aspnetForm"];
    f.__EVENTTARGET.value = target;
    f.submit();
  }
</script>
</head>
<body>
{% block body %}{% endblock %}
{% if blocking_overlay %}
<div style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:1000" onclick="return false;">
  <div style="position:absolute;left:50%;top:30%;margin-left:-170px;width:340px;background:#ece9d8;border:2px outset #fff;padding:10px">
    <b>Duplicate Session Detected</b><br><br>
    Another workstation is signed on with your User ID. Continue this session?<br><br>
    <center>
      <input type="button" class="btn" value="Continue Session" onclick="this.parentNode.parentNode.parentNode.style.display='none'">
      <input type="button" class="btn" value="End Other Session" onclick="this.parentNode.parentNode.parentNode.style.display='none'">
    </center>
  </div>
</div>
{% endif %}
</body>
</html>
