[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> typed capability artifacts -> deterministic, guarded replay with human handoff."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "openai>=1.50",
    "packaging>=24",
    "playwright>=1.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
cua = "cua.cli:main"
mock-corebank = "mock_corebank.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "src/mock_corebank"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "TC", "PL", "C4", "PIE", "RET"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity heuristics; reviewed by hand
    "S101",     # asserts are fine in tests
    "TC001", "TC002", "TC003",  # pydantic needs runtime types
    "RUF012",
    "PLR0917",  # typer commands are declared with many keyword options
    "PLC0415",  # deliberate lazy imports (optional LLM SDKs, CLI start-up time)
    "ASYNC240", # tiny local mkdir/write calls; not worth a thread hop
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "SIM117"]
"src/mock_corebank/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cua", "mock_corebank"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "browser: needs a Playwright Chromium and the mock app (started automatically)",
]
addopts = "-ra --strict-markers"
